server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: none
        path: /

spring:
  application:
    name: resume
  datasource:
    url: jdbc:mysql://localhost:3306/${SPRING_DATABASE}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
    mode: HTML
  data:
    redis:
      host: localhost
      port: 6379
      password: myredis123
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    connect-retries: 3
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${SPRING_MAIL_HOST}           # SMTP伺服器地址
    port: ${SPRING_MAIL_PORT:587}       # SMTP伺服器端口
    username: ${SPRING_MAIL_USERNAME}   # SMTP伺服器使用者名稱
    password: ${SPRING_MAIL_PASSWORD}   # 輸入應用程式密碼(如Google帳戶產生的)
    properties:
      mail.smtp:
        auth: true              # 啟用SMTP身分驗證
        starttls.enable: true   # 啟用STARTTLS加密
        timeout: 5000
logging:
  level:
    com.felixsiu.resume: DEBUG
    com.felixsiu.resume.repository: DEBUG
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 開啟駝峰命名自動轉換
  mapper-locations: classpath:mapper/**/*.xml
springdoc:
  api-docs:
    enabled: true      # 啟用 /v3/api-docs 端點
    path: /v3/api-docs
  swagger-ui:
    enabled: true      # 啟用 Swagger UI
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
jwt:
  secret: ${SPRING_JWT_SECRET}
  cookie:
    name-access: ACCESS_TOKEN
    name-refresh: REFRESH_TOKEN
    name-xsrf: XSRF_TOKEN
    secure: true
    same-site: None
    path: /
    access-ttl-seconds: 1800        # 30min
    refresh-ttl-seconds-short: 28800      # 8h（rememberMe=false）
    refresh-ttl-seconds-long: 604800    # 7d（rememberMe=true）
app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
  mail:
    from: ${SPRING_MAIL_FROM}
    frontend-base-url: ${APP_FRONTEND_BASE_URL}