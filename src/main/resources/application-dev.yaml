server:
  port: 8080

spring:
  application:
    name: resume
  datasource:
    url: jdbc:mysql://localhost:3306/${SPRING_DATABASE}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    open-in-view: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
    mode: HTML
  data:
    redis:
      host: localhost
      port: 6379
      password: myredis123
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    connect-retries: 3
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
logging:
  level:
    '[com.felixsiu.resume.repository]': DEBUG
    org:
      hibernate:
        SQL: DEBUG
mybatis:
  configuration:
    map-underscore-to-camel-case: true #  開啟 MyBatis 駝峰命名自動轉換
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/**/*.xml
springdoc:
  api-docs:
    enabled: true      # 啟用 /v3/api-docs 端點
    path: /v3/api-docs
  swagger-ui:
    enabled: true      # 啟用 Swagger UI
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
jwt:
  secret: ${SPRING_JWT_SECRET}
app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"