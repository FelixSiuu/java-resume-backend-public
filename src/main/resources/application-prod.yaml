server:
  port: 8080

spring:
  application:
    name: resume
  datasource:
    url: jdbc:mysql://${SPRING_DB_HOST}:${SPRING_DB_PORT}/${SPRING_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    open-in-view: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
    mode: HTML
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    connect-retries: 3
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
mybatis:
  configuration:
    map-underscore-to-camel-case: true
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
springdoc:
  api-docs:
    enabled: false     # 關閉 /v3/api-docs 端點
  swagger-ui:
    enabled: false     # 關閉 Swagger UI
jwt:
  secret: ${SPRING_JWT_SECRET}
app:
  cors:
    allowed-origins:
      - "https://web-profolio-felix.vercel.app"
      - "https://web-profolio-admin.vercel.app"